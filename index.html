        <p class="eyebrow" data-field="hero.eyebrow"></p>
        <h1 data-html="hero.title"></h1>
        <p class="hero-subtitle" data-field="hero.subtitle"></p>

          <span aria-hidden="true">→</span>
        </a>
      </div>
      <div class="hero-media">
        <img id="heroImage" src="assets/images/portrait-phong.jpg" alt="">
      </div>
      <div class="hero-facts" id="heroFacts"></div>
      <a class="hero-market-entry" href="ja/japan-market/" data-market-link>
        <span class="hero-market-label" data-field="japanMarket.kicker"></span>
        <span class="hero-market-copy">
          <strong data-field="japanMarket.title"></strong>
          <span data-field="japanMarket.lead"></span>
        </span>
        <span class="hero-market-cta"><span data-field="japanMarket.cta"></span><span aria-hidden="true">→</span></span>

    </section>

        <p data-field="message.lead"></p>

      <div class="message-list" id="messageList"></div>
    </section>

    <section class="section" id="services">
      <div class="split-head">
        <div>
          <p class="eyebrow" data-field="services.eyebrow"></p>
          <h2 data-field="services.title"></h2>
        </div>
        <p data-field="services.lead"></p>
      </div>
      <div class="service-grid" id="serviceGrid"></div>

          <strong data-field="japanMarket.serviceTitle"></strong>

    </section>

        <p data-field="cases.lead"></p>
      </div>
      <div class="case-list" id="caseList"></div>

      </div>
      <div class="company-grid">
        <section class="info-panel">

        <input class="hp-field" type="text" name="website" tabindex="-1" autocomplete="off">
        <label>
          <span data-field="contact.form.name"></span>
          <input type="text" name="name" required autocomplete="name">
        </label>
        <label>
          <span data-field="contact.form.company"></span>
          <input type="text" name="company" autocomplete="organization">
        </label>
        <label>
          <span data-field="contact.form.email"></span>
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
